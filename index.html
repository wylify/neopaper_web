<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>NEOPAPER</title>
  <meta name="description" content="Device-label wallpapers with your contact QR and a reader-app barcode. Works offline; everything stays on your device.">
  <meta name="theme-color" content="#0E0E11">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEOPAPER">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/space_grotesk.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/jetbrains_mono.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/nav.js">
  <link rel="modulepreload" href="js/render.js">
  <link rel="modulepreload" href="js/home.js">
  <link rel="modulepreload" href="js/builder.js">
  <link rel="modulepreload" href="js/editors.js">
  <link rel="modulepreload" href="js/scan.js">
  <link rel="modulepreload" href="js/model.js">
  <link rel="modulepreload" href="js/np1.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/photo.js">
  <link rel="modulepreload" href="js/previews.js">
  <link rel="modulepreload" href="js/codes.js">
  <link rel="modulepreload" href="js/qr.js">
  <link rel="modulepreload" href="js/capacity.js">
  <link rel="modulepreload" href="js/code128.js">
  <link rel="modulepreload" href="js/colors.js">
  <link rel="modulepreload" href="js/colorpicker.js">
  <link rel="modulepreload" href="js/sheet.js">
  <link rel="modulepreload" href="js/export.js">
  <link rel="modulepreload" href="js/install.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/parse.js">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div class="boot" id="boot" aria-hidden="true"><i></i></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="busy" id="busy" hidden role="alert" aria-live="assertive">
    <div class="busy-card"><i></i></div>
    <p class="busy-text mono-label"></p>
  </div>

  <noscript><p class="fatal">NEOPAPER needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
